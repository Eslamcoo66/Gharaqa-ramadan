<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>دورة رمضانية – Master & Audience</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
h1 { text-align: center; }
.group { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #eee; }
input[type="number"] { width: 50px; }
button { padding: 5px 10px; margin-left: 5px; cursor: pointer; }
.hidden { display:none; }
#toggleButtons { text-align:center; margin-bottom:20px; }
</style>
</head>
<body>

<h1>دورة رمضانية</h1>

<div id="toggleButtons" class="hidden">
  <button onclick="showMode('master')">Master – إدارة النتائج</button>
  <button onclick="showMode('audience')">Audience – عرض النتائج</button>
</div>

<div id="masterView" class="hidden"></div>
<div id="audienceView"></div>

<script>
// ===== إعداد كلمة السر للماستر =====
const MASTER_PASSWORD = "7890"; // تقدر تغيرها لأي كلمة تحب

// ===== بيانات الفرق =====
const groupsData = {
  A: ["أصدقاء عبدالوهاب","شباب الشوكة","محلة كيل","أصدقاء حوش عيسي","شباب كوم البوص","الغراقة الغربية"],
  B: ["الشوكة الحاجر","الريف المصري","الصوالحية","اصدقاء محمد فؤاد","الزمالكاوية","البرنوجي"],
  E: ["ممتاز","كوم البوص","نجع العزايم","عزبة الست","أنصاف","أصدقاء اسامه الجارحي"],
  F: ["نجوم بطورس","الديابة","كوم القناطر","المحطة","الحريفة","الغراقة الشرقية"]
};

const storageKey = "ramadanLeagueData";
let groups = {};

// ===== تحميل البيانات من LocalStorage =====
const savedData = localStorage.getItem(storageKey);
if(savedData){
  groups = JSON.parse(savedData);
} else {
  for (let g in groupsData) {
    groups[g] = {};
    for (let team of groupsData[g]) {
      groups[g][team] = { played:0, win:0, draw:0, loss:0, gf:0, ga:0, gd:0, points:0 };
    }
  }
}

// ===== التحقق من الرابط Master =====
let isMaster = false;
if(window.location.search.includes("master")){
  const pw = prompt("ادخل كلمة سر الماستر:");
  if(pw === MASTER_PASSWORD){
    isMaster = true;
    document.getElementById("toggleButtons").classList.remove("hidden");
  } else {
    alert("كلمة السر خطأ! سيتم فتح نسخة الجمهور.");
  }
}

// ===== إنشاء واجهة Master =====
const masterDiv = document.getElementById("masterView");
if(isMaster){
  for (let g in groupsData) {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h2>المجموعة ${g}</h2>
      <table id="master-table-${g}">
        <thead>
          <tr>
            <th>الفريق</th>
            <th>لعب</th>
            <th>فوز</th>
            <th>تعادل</th>
            <th>خسارة</th>
            <th>أهداف +</th>
            <th>أهداف -</th>
            <th>فارق الأهداف</th>
            <th>نقاط</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <h4>أدخل نتيجة مباراة:</h4>
      <select id="team1-${g}"></select>
      <input type="number" id="score1-${g}" min="0" value="0">
      -
      <input type="number" id="score2-${g}" min="0" value="0">
      <select id="team2-${g}"></select>
      <button onclick="addMatch('${g}')">أضف النتيجة</button>
      `;
    masterDiv.appendChild(div);

    // إنشاء صفوف الفرق
    const tbody = div.querySelector("tbody");
    for (let team of groupsData[g]) {
      const tr = document.createElement("tr");
      tr.id = `master-${g}-${team}`;
      tbody.appendChild(tr);
    }

    // إضافة الفرق للاختيار
    const t1 = div.querySelector(`#team1-${g}`);
    const t2 = div.querySelector(`#team2-${g}`);
    for (let team of groupsData[g]) {
      t1.add(new Option(team, team));
      t2.add(new Option(team, team));
    }

    renderGroup(g, 'master');
  }
}

// ===== إنشاء واجهة Audience =====
const audienceDiv = document.getElementById("audienceView");
for (let g in groupsData) {
  const div = document.createElement("div");
  div.className = "group";
  div.innerHTML = `<h2>المجموعة ${g}</h2>
    <table id="audience-table-${g}">
      <thead>
        <tr>
          <th>الفريق</th>
          <th>لعب</th>
          <th>فوز</th>
          <th>تعادل</th>
          <th>خسارة</th>
          <th>أهداف +</th>
          <th>أهداف -</th>
          <th>فارق الأهداف</th>
          <th>نقاط</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>`;
  audienceDiv.appendChild(div);
  renderGroup(g, 'audience');
}

// ===== دوال =====
function addMatch(group) {
  const t1 = document.getElementById(`team1-${group}`).value;
  const t2 = document.getElementById(`team2-${group}`).value;
  const s1 = parseInt(document.getElementById(`score1-${group}`).value);
  const s2 = parseInt(document.getElementById(`score2-${group}`).value);

  if(t1 === t2) { alert("لا يمكن اختيار نفس الفريق"); return; }

  const updateTeam = (team, win=0, draw=0, loss=0, gf=0, ga=0, pts=0) => {
    const data = groups[group][team];
    data.played +=1;
    data.win += win; data.draw += draw; data.loss += loss;
    data.gf += gf; data.ga += ga;
    data.gd = data.gf - data.ga;
    data.points += pts;
  }

  if(s1 > s2) { updateTeam(t1,1,0,0,s1,s2,3); updateTeam(t2,0,0,1,s2,s1,0); }
  else if(s1 < s2){ updateTeam(t1,0,0,1,s1,s2,0); updateTeam(t2,1,0,0,s2,s1,3); }
  else { updateTeam(t1,0,1,0,s1,s2,1); updateTeam(t2,0,1,0,s2,s1,1); }

  // حفظ البيانات
  localStorage.setItem(storageKey, JSON.stringify(groups));

  renderGroup(group, 'master');
  renderGroup(group, 'audience');
}

function renderGroup(group, mode='master') {
  const tbody = document.getElementById(`${mode}-table-${group}`).querySelector("tbody");
  const sortedTeams = Object.keys(groups[group]).sort((a,b)=>{
    const x = groups[group][b];
    const y = groups[group][a];
    if(x.points !== y.points) return x.points - y.points >0? -1:1;
    return x.gd - y.gd >0? -1:1;
  });

  tbody.innerHTML = "";
  for(let team of sortedTeams){
    const data = groups[group][team];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${team}</td>
      <td>${data.played}</td>
      <td>${data.win}</td>
      <td>${data.draw}</td>
      <td>${data.loss}</td>
      <td>${data.gf}</td>
      <td>${data.ga}</td>
      <td>${data.gd}</td>
      <td>${data.points}</td>`;
    tbody.appendChild(tr);
  }
}

// ===== تبديل الواجهة =====
function showMode(mode){
  if(mode==='master'){
    masterDiv.classList.remove('hidden');
    audienceDiv.classList.add('hidden');
  } else {
    masterDiv.classList.add('hidden');
    audienceDiv.classList.remove('hidden');
  }
}

// ===== تحديث الجمهور فور أي تعديل من الماستر =====
window.addEventListener('storage', (event)=>{
  if(event.key === storageKey){
    groups = JSON.parse(event.newValue);
    for(let g in groupsData){
      renderGroup(g,'audience');
    }
  }
});
</script>

</body>
</html>
